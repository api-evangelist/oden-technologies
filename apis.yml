aid: oden-technologies
name: Oden Technologies
description: >-
  Oden Technologies provides AI-powered software for manufacturing optimization,
  delivering real-time, AI-driven recommendations to front-line factory operators
  to increase output, improve quality, decrease costs, and reduce downtime. Its
  platform spans Forge AI agents, Process AI, Factory Analytics, and a Data
  Engine. The Oden Private Partner API (v2) is a RESTful, JSON-over-HTTPS API for
  reading, creating, and updating factory data on the Oden Platform: factories,
  lines, products, production intervals (runs, batches, states), scrap/yield,
  quality tests, metric groups, targets, dashboards, and the Oden Query Language
  (OQL). Oden is headquartered in New York with an office in Altrincham, UK, and
  is backed by EQT Ventures.
