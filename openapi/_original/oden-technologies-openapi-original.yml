        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/NotUniqueError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/UnimplementedError" }

components:
  parameters:
    FormatParam:
      in: query
      name: format
      required: false
      schema:
        type: string
        enum:
          - json
          - jsonextended
          - csv
        default: json
      description: |
        Format of the response. Can be `json`, `jsonextended` or `csv`. If unspecified, defaults to `jsonextended`.

    PatternParam:
      in: query
      name: pattern
      required: false
      schema:
        type: string
        enum:
          - exact
          - contains
          - regex
        default: exact
      description: |
        Optional pattern type to use for matching:
        - `exact` for exact match
        - `contains` for the string to be contained in the query
        - `regex` to match based on a regular expression

  schemas:
    Match:
      type: string
      enum: [first, last, unique, all]
      default: unique
      description: |
        Describes which item(s) to match when searching for an entity:
        - `unique` (default): will return an error if the search object matches multiple entities
        - `all`: will return every item that matches search entity
        - `last`: will return the most recent object, where applicable
        - `first`: will return the least recent object, where applicable

    Factory:
      type: object
      description: An entity representing a factory.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        secondary_name: { type: string, nullable: true }
        timezone: { type: string }
        match: { $ref: "#/components/schemas/Match" }

    Line:
      type: object
      description: An entity representing a single line of production.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        secondary_name: { type: string }
        factory: { $ref: "#/components/schemas/Factory" }
        match: { $ref: "#/components/schemas/Match" }

    Product:
      type: object
      description: An entity representing a product
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        match: { $ref: "#/components/schemas/Match" }

    ProductMapping:
      type: object
      description: >
        An entity representing a product/line mapping. Mappings are simple 1:1 relationships, and
        as such cannot be modified, only created.
      properties:
        product: { $ref: "#/components/schemas/Product" }
        line: { $ref: "#/components/schemas/Line" }
        match: { $ref: "#/components/schemas/Match" }

    ProductAttribute:
      type: object
      description: >
        An entity representing an attribute of a product such as a color or material
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: string }
        value: { type: string }
        product: { $ref: "#/components/schemas/Product" }
        rule_based: { type: boolean }
        match: { $ref: "#/components/schemas/Match" }

    StateCategory:
      type: object
      description: An entity representing a state category. During search, ID will take precedence over name.
      properties:
        id: { type: integer }
        name: { type: string }

    StateReason:
      type: object
      description: An entity representing a state reason. During search, ID will take precedence over name.
      properties:
        id: { type: integer }
        name: { type: string }

    Target:
      type: object
      description: An object representing a performance target for a line, product, and metric group.
      properties:
        metric_group: { $ref: "#/components/schemas/MetricGroup" }
        product: { $ref: "#/components/schemas/Product" }
        line: { $ref: "#/components/schemas/Line" }
        target_value: { type: number, format: double }
        lsl: { type: number, format: double }
        usl: { type: number, format: double }
        match: { $ref: "#/components/schemas/Match" }

    Interval:
      type: object
      description: An object representing an interval of time on a line and associated metadata.
      required: [type, line]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/IntervalType" }
        name: { type: string }
        line: { $ref: "#/components/schemas/Line" }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        metadata:
          description: >
            Metadata about this interval, such as the associated run or the state category.
            Will differ based on the type of interval.
          oneOf:
            - $ref: "#/components/schemas/BatchMetadata"
            - $ref: "#/components/schemas/RunMetadata"
            - $ref: "#/components/schemas/StateMetadata"
            - $ref: "#/components/schemas/CustomMetadata"
          discriminator:
            propertyName: metadata_type
            mapping:
              batch: "#/components/schemas/BatchMetadata"
              run: "#/components/schemas/RunMetadata"
              state: "#/components/schemas/StateMetadata"
              custom: "#/components/schemas/CustomMetadata"
        match: { $ref: "#/components/schemas/Match" }

    IntervalType:
      type: object
      description: An object representing a interval type.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        match: { $ref: "#/components/schemas/Match" }

    IntervalTypeSet:
      type: object
      description: |
        Create or update a custom interval type. Omit `id` to create (requires `name`);
        include `id` to update. On update, `name` (if present) is ignored. Use `null` for `tags` to leave tags unchanged; `[]` clears tags.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        metadata_schema: { type: string }
        tags:
          type: array
          items: { type: string }
          nullable: true

    IntervalBulkCreate:
      type: object
      description: A set of intervals to create
      properties:
        type: { $ref: "#/components/schemas/IntervalType" }
        line: { $ref: "#/components/schemas/Line" }
        intervals:
          { type: array, items: { $ref: "#/components/schemas/Interval" } }

    IntervalBulkUpdate:
      type: object
      description: A set of intervals to update
      properties:
        type: { $ref: "#/components/schemas/IntervalType" }
        line: { $ref: "#/components/schemas/Line" }
        intervals:
          { type: array, items: { $ref: "#/components/schemas/Interval" } }

    IntervalBulkDelete:
      type: object
      description: A range of intervals to delete
      properties:
        type: { $ref: "#/components/schemas/IntervalType" }
        line: { $ref: "#/components/schemas/Line" }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        hard_delete: { type: boolean, default: true }

    BatchMetadata:
      type: object
      description: Metadata associated with a batch interval
      properties:
        metadata_type:
          type: string
          enum: [batch]
          readOnly: true
          x-go-type-skip-optional-pointer: true
        run: { $ref: "#/components/schemas/Interval" }
      additionalProperties: true

    RunMetadata:
      type: object
      description: Metadata associated with a run interval
      properties:
        metadata_type:
          type: string
          enum: [run]
          readOnly: true
          x-go-type-skip-optional-pointer: true
        product: { $ref: "#/components/schemas/Product" }
        target: { $ref: "#/components/schemas/Target" }
      additionalProperties: true

    StateMetadata:
      type: object
      description: Metadata associated with a state interval
      properties:
        metadata_type:
          type: string
          enum: [state]
          readOnly: true
          x-go-type-skip-optional-pointer: true
        reason: { $ref: "#/components/schemas/StateReason" }
        comment: { type: string }
        category: { $ref: "#/components/schemas/StateCategory" }
      additionalProperties: true

    CustomMetadata:
      type: object
      description: Metadata associated with a custom interval type
      properties:
        metadata_type:
          type: string
          enum: [custom]
          readOnly: true
          x-go-type-skip-optional-pointer: true
      additionalProperties: true

    Unit:
      type: object
      description: >
        A Unit describes a unit of measurement.

      properties:
        id: { type: integer }
        symbol: { type: string }
        name: { type: string }
        kind_of_quantity: { type: string }

    ScrapYieldSchema:
      type: object
      description: >
        Scrap yield schema represents a factory's scrap/yield data ingestion configuration.

      properties:
        id: { type: string, format: uuid }
        factory: { $ref: "#/components/schemas/Factory" }
        scrap_conversion_factor: { type: number, format: double }
        scrap_unit: { $ref: "#/components/schemas/Unit" }
        yield_conversion_factor: { type: number, format: double }
        yield_unit: { $ref: "#/components/schemas/Unit" }

    ScrapYieldData:
      type: object
      description: >
        An object representing scrap and yield data for a line for a particular
        run or batch interval. Data can be sent unstructured in the `raw_data`
        field as long as we have a scrap/yield schema for the factory.
      properties:
        raw_data: { type: string, format: json }
        id: { type: string, format: uuid }
        schema: { $ref: "#/components/schemas/ScrapYieldSchema" }
        timestamp: { type: string, format: date-time, nullable: true }
        match: { $ref: "#/components/schemas/Match" }

    QualityTest:
      type: object
      description: >
        An object representing a QA test for a line for a particular run or batch
        interval.
      properties:
        id: { type: string, format: uuid }
        raw_data: { type: object }
        timestamp: { type: string, format: date-time }
        interval: { $ref: "#/components/schemas/Interval" }
        quality_schema: { $ref: "#/components/schemas/QualitySchema" }
        match: { $ref: "#/components/schemas/Match" }

    QualitySchema:
      type: object
      description: >
        A schema for quality tests.
        Note: the id is currently implemented as a string, but that string should be a stringified integer.

      properties:
        id: { type: string, example: "23" }
        factory: { $ref: "#/components/schemas/Factory" }
        schema: { type: string, format: json }
        description: { type: string }
        match: { $ref: "#/components/schemas/Match" }

    MetricGroup:
      type: object
      description: An object representing a metric group; a grouping of like metrics across lines, factories.
      properties:
        name: { type: string }
        description: { type: string }
        id: { type: string, format: uuid }
        unit_kind_of_quantity: { type: string }
        match: { $ref: "#/components/schemas/Match" }

    OQLQuery:
      type: object
      description: An object representing an OQL query.
      required: [query]
      properties:
        query: { type: string }

    DashboardExecuteRequest:
      type: object
      description: >
        Request envelope for executing every module in a dashboard.
      required: [dashboard]
      properties:
        dashboard:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        range: { $ref: "#/components/schemas/DashboardExecuteRange" }
        filters: { $ref: "#/components/schemas/DashboardExecuteFilters" }

    DashboardExecuteRange:
      type: object
      description: >
        Time window applied to every module. Either supply an absolute
        window (`start` and `end`) OR a relative window (`anchor` and
        `offset`, optionally with `timezone`), not both.
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        anchor:
          type: string
          description: Anchor expression for a relative range, e.g. `now`.
        offset:
          type: string
          description: Offset expression for a relative range, e.g. `-7D`.
        timezone:
          type: string
          description: IANA timezone identifier (defaults to UTC).

    DashboardExecuteFilters:
      type: object
      description: >
        Optional filter overrides applied to every module. Every field is
        optional; omitting one means "no override on that dimension".
      properties:
        lines:
          type: array
          description: >
            Lines to restrict to. Each entry must supply `id`, `name`, or
            both; entries that supply neither are rejected. Other Line
            fields (factory, secondary_name, match) are not used here and
            are intentionally omitted so generated clients don't suggest
            them as inputs.
          items:
            type: object
            anyOf:
              - required: [id]
              - required: [name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        shifts:
          type: array
          items: { type: integer, format: int32 }
        product_ids:
          type: array
          items: { type: string, format: uuid }
        product_attribute_value_ids:
          type: array
          items: { type: string, format: uuid }
        scrap_categories:
          type: array
          items: { type: string, format: uuid }
        states:
          type: object
          properties:
            state_types:
              type: array
              items: { type: string }
            state_category_and_reasons:
              type: array
              items:
                type: object
                required: [state_category]
                properties:
                  state_category: { type: integer, format: int32 }
                  state_reason: { type: string }
        custom_intervals:
          type: array
          items:
            type: object
            required: [type, value_contains]
            properties:
              type: { type: string }
              value_contains: { type: string }

    DashboardExecuteResult:
      type: object
      description: Executed output of a single dashboard module.
      required: [module_id, module_name, module_type]
      properties:
        module_id: { type: string, format: uuid }
        module_name: { type: string }
        module_type:
          type: string
          description: >
            The module's stored visualization (e.g. `table`, `line_chart`,
            `bar_chart`). Type label only — does not change the response
            shape.
        range:
          type: object
          description: >
            Resolved absolute time window the executed query actually
            covers. For relative requests this is the concrete window the
            anchor/offset resolved to.
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        filters_applied:
          type: object
          description: >
            Echo of the filter dimensions that were applied, resolved to
            human-readable values where possible (e.g. line names instead
            of IDs).
          additionalProperties: true
        columns:
          type: array
          nullable: true
          description: >
            Column metadata. `type` is derived from the first non-null cell
            in the column. Null when the module errored.
          items: { $ref: "#/components/schemas/DashboardColumnSpec" }
        rows:
          type: array
          nullable: true
          description: >
            Row data as objects keyed by column name (not positional
            arrays). Values are typed JSON natively. Null when the module
            errored.
          items:
            type: object
            additionalProperties: true
        error:
          type: string
          nullable: true
          description: >
            Set to a short message when the module failed to parse or
            execute. Null on success.

    DashboardColumnSpec:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [string, number, boolean, datetime]

    MaintenanceWorkOrder:
      type: object
      description: An object representing a maintenance work order on a line.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        external_id: { type: string }
        line: { $ref: "#/components/schemas/Line" }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
        match: { $ref: "#/components/schemas/Match" }

    GenericError:
      type: object
      required: [error, retryable]
      properties:
        error: { type: string }
        retryable: { type: boolean }

  responses:
    NotUniqueError:
      description: >
        A {match: "unique"} was requested, but multiple entities matched the
        search parameters.
      content:
        application/json:
          schema:
            type: object
            required: [entity_name, num_matches, error, retryable]
            properties:
              entity_name: { type: string }
              num_matches: { type: integer }
              error: { type: string }
              retryable: { type: boolean }

    InternalError:
      description: >
        An internal server error has occurred. If reporting the error to Oden, include the
        ID returned in this response to aid in debugging.
      content:
        application/json:
          schema:
            type: object
            required: [error, retryable, id]
            properties:
              error: { type: string }
              retryable: { type: boolean }
              id: { type: string, format: uuid }

    UnauthorizedError:
      description: User has provided either no credentials or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericError" }

    ForbiddenError:
      description: >
        User has provided valid credentials but is not authorized to access the entity
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericError" }

    NotFoundError:
      description: Entity not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericError" }

    UnimplementedError:
      description: Endpoint is not yet implemented
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericError" }

    TooManyRequestsError:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericError" }

    ParameterError:
      description: An error occurred regarding one of the input parameters
      content:
        application/json:
          schema:
            type: object
            required: [error, name, retryable]
            properties:
              error: { type: string }
              name: { type: string }
              retryable: { type: boolean }

  securitySchemes:
    APIKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Prefix the value with \"Token\" to indicate the custom authorization type'
