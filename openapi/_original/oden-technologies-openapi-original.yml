              schema: { $ref: "#/components/schemas/MaintenanceWorkOrder" }

        "400": { $ref: "#/components/responses/ParameterError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/NotUniqueError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/UnimplementedError" }

  /v2/maintenance_work_order/delete:
    post:
