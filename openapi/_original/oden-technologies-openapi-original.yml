                value:
                  name: Scheduled Maintenance Q1
                  line:
                    id: 0012ab4d-1234-123a-8c76-6ea2344be6df
                  description: Quarterly scheduled maintenance
                  external_id: MWO-2024-001
                  started_at: "2024-01-15T08:00:00Z"
                  completed_at: "2024-01-15T17:00:00Z"
                  metadata: '{"technician": "John Doe", "priority": "high"}'
              Update an existing maintenance work order:
                summary: Update an existing maintenance work order
                value:
                  id: 0012ab4d-1234-123a-8c76-6ea2344be6df
                  completed_at: "2024-01-15T18:30:00Z"
                  metadata: {"technician": "John Doe", "priority": "high", "notes": "Completed late due to parts delay"}

      responses:
        "200":
          description: A list containing the created or updated maintenance work order.
          content:
