  /v2/dashboard/execute:
    post:
      operationId: execute_dashboard
      summary: Execute a dashboard
      tags: ["Dashboards"]
      description: |
        Execute every module in a dashboard with shared time-range and filter
        overrides, returning the columns and rows produced by each module.

        Modules execute in parallel and are reported in the dashboard's stored
        module order. Per-module failures (parse, dispatch) land in the
        `error` field of that module's result; siblings continue to run.

        Known v1 limitations:
        - Template variables (`{var_name}` in stored OQL) are not substituted
          server-side. Modules containing unsubstituted placeholders will
          fail at parse time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardExecuteRequest" }

      responses:
        "200":
          description: >
            Dashboard loaded and each module executed. Individual modules may
            still report `error` in their result; this is not a 200/non-200
            distinction.
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: "#/components/schemas/DashboardExecuteResult" }

        "400": { $ref: "#/components/responses/ParameterError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "429": { $ref: "#/components/responses/TooManyRequestsError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501": { $ref: "#/components/responses/UnimplementedError" }

